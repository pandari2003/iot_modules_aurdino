<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, orientation=landscape">
  <title>Tracked Rover Control Panel</title>

    .joystick-bg { width: 140px; height: 140px; background: #151522; border: 3px solid #333; border-radius: 50%; position: relative; }
    .joystick-bg::before, .joystick-bg::after { content: ''; position: absolute; background: #444; }
    .joystick-bg::before { width: 100%; height: 2px; top: 50%; left: 0; transform: translateY(-50%); }
    .joystick-bg::after { width: 2px; height: 100%; left: 50%; top: 0; transform: translateX(-50%); }
    .stick { width: 40px; height: 40px; background: #00d2ff; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); transition: top 0.05s, left 0.05s; box-shadow: 0 0 15px #00d2ff; z-index: 10; }

    .center-panel { width: 35%; display: flex; flex-direction: column; justify-content: space-evenly; }
    
    .title { text-align: center; color: #00d2ff; margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }

    .digital-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: center; }

    .toggle.active { background: #00d2ff; }

</head>
<body>

        <div>
          <div id="sw1" class="toggle"><div class="toggle-thumb"></div></div>
          <span class="label">MOD 2</span>
        </div>

          <div id="sw2" class="toggle"><div class="toggle-thumb"></div></div>

      <span class="label">Joystick 1</span>
    </div>

  <script>
    function mapToPercent(val) { return (val / 3310) * 100; }

    function updateJoystick(id, x, y) {
      let el = document.getElementById(id);
      el.style.left = mapToPercent(x) + "%";
      el.style.top = mapToPercent(3310 - y) + "%";
    }

    function updateDigital(id, state) {
      let el = document.getElementById(id);
      if (state == 1) el.classList.add('active');
      else el.classList.remove('active');
    }

    setInterval(function() {
      fetch('/veri')
        .then(response => response.json())
        .then(data => {
          updateJoystick('stick1', data.j1y, data.j1x);
          updateJoystick('stick2', data.j2y, data.j2x);
          
          document.getElementById('p1_bar').value = data.p1;
          document.getElementById('p2_bar').value = data.p2;

          updateDigital('sw1', data.sw2);
          updateDigital('sw2', data.sw1);
          updateDigital('btn1', data.btn2);
          updateDigital('btn2', data.btn1);
        }).catch(err => console.log("Veri bekliyor..."));
    }, 50);
  </script>
</body>
</html>
